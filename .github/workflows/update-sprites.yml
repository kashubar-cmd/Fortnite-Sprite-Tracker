# Keeps sprites.js and img/ in sync with the source site, once a day.
# You can also run it by hand: repo > Actions > "Update sprites" > Run workflow.
name: Update sprites

on:
  schedule:
    - cron: '17 9 * * *'        # daily, 09:17 UTC (off the hour on purpose)
  workflow_dispatch:

permissions:
  contents: write                # lets the job commit changes back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh sprite list and mirror new images
        run: node scripts/update.mjs
      - name: Commit if anything changed
        run: |
          git config user.name  "sprite-bot"
          git config user.email "sprite-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update sprites $(date -u +%F)"
            git push
          fi
